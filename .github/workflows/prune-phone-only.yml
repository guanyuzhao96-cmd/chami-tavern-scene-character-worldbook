name: Prune repository to standalone phone plugin

on:
  push:
    branches:
      - agent/standalone-phone-plugin

permissions:
  contents: write

jobs:
  prune:
    if: ${{ !contains(github.event.head_commit.message, '[phone-pruned]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove non-phone source
        shell: bash
        run: |
          set -euo pipefail

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'Phone_emulator' \
            ! -name 'core' \
            ! -name 'styles' \
            ! -name 'manifest.json' \
            ! -name 'phone-plugin.js' \
            ! -name 'README.md' \
            ! -name 'CHARACTER_PROFILE.md' \
            ! -name 'LICENSE' \
            -exec rm -rf {} +

          find core -mindepth 1 -maxdepth 1 \
            ! -name 'api-adapter.js' \
            ! -name 'event-bus.js' \
            ! -name 'db-manager.js' \
            ! -name 'plugin-context.js' \
            -exec rm -rf {} +

          find styles -mindepth 1 -maxdepth 1 \
            ! -name 'phone-plugin.css' \
            -exec rm -rf {} +

          rm -rf .github

      - name: Commit pruned repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'refactor: keep standalone phone source only [phone-pruned]'
          git push origin HEAD:agent/standalone-phone-plugin
